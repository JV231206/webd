<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Moving Car Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100vh;
      background: linear-gradient(to bottom, #87ceeb 60%, #e0f6ff 100%);
      overflow: hidden;
    }
    .road {
      position: relative;
      width: 100%;
      height: 160px;
      background-color: #333;
      border-top: 6px solid #555;
    }
    .road::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 6px;
      background: repeating-linear-gradient(
        to right,
        #fff 0,
        #fff 40px,
        transparent 40px,
        transparent 80px
      );
      transform: translateY(-50%);
    }
    .car-container {
      position: absolute;
      bottom: 60px;
      width: 220px;
      height: 90px;
      animation: drive 6s linear infinite;
    }
    .car-roof {
      position: absolute;
      top: 0;
      left: 45px;
      width: 110px;
      height: 45px;
      background-color: #d32f2f;
      border-radius: 20px 20px 0 0;
    }
    .car-window {
      position: absolute;
      top: 8px;
      height: 30px;
      background-color: #b3e5fc;
    }

    .window-front {
      right: 10px;
      width: 40px;
      border-radius: 0 10px 0 0;
    }

    .window-back {
      left: 10px;
      width: 40px;
      border-radius: 10px 0 0 0;
    }
    .car-body {
      position: absolute;
      bottom: 20px;
      width: 220px;
      height: 45px;
      background-color: #e53935;
      border-radius: 12px 25px 8px 8px;
    }
    .headlight {
      position: absolute;
      right: 4px;
      top: 14px;
      width: 8px;
      height: 14px;
      background-color: #ffeb3b;
      border-radius: 3px;
    }
    .wheel {
      position: absolute;
      bottom: 5px;
      width: 42px;
      height: 42px;
      background-color: #212121;
      border: 4px solid #757575;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .wheel::before,
    .wheel::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 3px;
      background-color: #bdbdbd;
      transform: translate(-50%, -50%);
    }

    .wheel::after {
      transform: translate(-50%, -50%) rotate(90deg);
    }

    .wheel-front {
      right: 28px;
    }

    .wheel-back {
      left: 28px;
    }
    @keyframes drive {
      0% {
        transform: translateX(-240px);
      }
      100% {
        transform: translateX(100vw);
      }
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="road">
    <div class="car-container">
      <div class="car-roof">
        <div class="car-window window-back"></div>
        <div class="car-window window-front"></div>
      </div>
      <div class="car-body">
        <div class="headlight"></div>
      </div>
      <div class="wheel wheel-back"></div>
      <div class="wheel wheel-front"></div>
    </div>
  </div>
</body>
</html>
