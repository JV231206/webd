<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #parent{
            height: 900vh;
            border: 2px solid;
            display: grid;
            grid-template-columns:300px 300px 300px ;
            grid-template-rows:300px 300px ;
            gap: 10px;
        }
        .box{
            height: 300px;
            width: 300px;
            border: 2px solid red;
            transition: 0.3s;
        }
        .box:hover{
            transform: scale(1.2);
        }
        img{
            height: 100%;
            width: 100%;
        }
        #one{
            background-color: black;
            grid-row: 2/3;
            grid-column: 3/4;
        }
        #two{
            background-color: blue;
        }
        #three{
            background-color: aquamarine;
        }
        #four{
            background-color: brown;
        }
        #five{
            background-color: chartreuse;
        }
        #six{
            background-color: cadetblue;
        }
        #seven{
            background-color: palevioletred;
        }
    </style>
</head>
<body>
    <div id="parent">
        <div id="one" class="box">
            <!-- <img src="https://images.unsplash.com/photo-1779896412200-e1047994622b?q=80&w=2670&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt=""> -->
        </div>
        <div id="two" class="box">
      <!-- <img src="https://images.unsplash.com/photo-1791015759850-71b517368170?q=80&w=989&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt=""> -->
        </div>
        <div id="three" class="box">
           <!-- <img src="https://plus.unsplash.com/premium_photo-1791004535618-ec49e0ee2bc9?q=80&w=2670&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt=""> -->
        </div>
        <div id="four" class="box">
            <!-- <img src="https://images.unsplash.com/photo-1772289238742-a49d38ca07f4?q=80&w=987&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">  -->
        </div>
        <div id="five" class="box">
            <!-- <img src="https://images.unsplash.com/photo-1791042146049-655617114644?q=80&w=987&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">  -->
        </div>
        <div id="six" class="box">
            <!-- <img src="https://images.unsplash.com/photo-1790997086052-1aa2b246f076?q=80&w=1336&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">  -->

</html>
