<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #one{
            height: 100px;
            width: 100px;
            border: solid 4px;
            
            position:fixed;
            top: 10px;
            
        }
         #two{
            height: 100px;
            width: 100px;
            border: solid 4px;
            
            position: fixed;
            top: 1000px;
        }
        #three{
            height: 100px;
            width: 100px;
            border: solid 4px;
            
            position: fixed;
            top: 1000px;
            right: 10px;
        }
        #four{
            height: 100px;
            width: 100px;
            border: solid 4px;
            
            position: fixed;
            top: 10px;
            right: 10px;
        }
        #five{
             height: 100px;
            width: 100px;
            border: solid 4px;
          top: 50%;
          left: 50%;

            position: absolute;
        }

    </style>
</head>
<body>
    <div id="one"></div>
    <div id="two"></div>
    <div id="three"></div>
    <div id="four"></div>
    <div id="five"></div>
</body>
</html>
